min_version = "2025.10.0"

[tools]
node = "22"
pnpm = "10"
rust = { channel = "stable", version = "latest", components = "rustfmt,clippy" }
uv = "latest"

[settings]
lockfile = true

[tasks.install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install --frozen-lockfile --prefer-offline"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "docs/package.json",
  "packages/*/package.json",
]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks."rust:format"]
hide = true
run = "cargo fmt --all"

[tasks."rust:format:check"]
hide = true
run = "cargo fmt --all --check"

[tasks."rust:clippy"]
hide = true
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."rust:check"]
hide = true
run = "cargo check --workspace --all-targets"

[tasks."rust:test"]
description = "Run Rust workspace tests"
run = "cargo test --workspace"

[tasks."ui:dev"]
description = "Watch UI package tests (vitest)"
depends = ["install"]
run = "pnpm --filter @yagoo/ui test:watch"

[tasks."ui:test"]
description = "Run @yagoo/ui unit tests"
depends = ["install"]
run = "pnpm --filter @yagoo/ui test"

[tasks."ui:check"]
description = "Typecheck @yagoo/ui"
depends = ["install"]
run = "pnpm --filter @yagoo/ui check"

[tasks."ui:build"]
description = "Typecheck UI (library is consumed via source exports)"
depends = ["ui:check"]

[tasks."browser:wasm"]
description = "Build Rust/Wasm bindings with the matching local wasm-bindgen CLI"
run = "pnpm --filter @yagoo/browser-engine build:wasm"

[tasks."browser:check"]
description = "Check browser engine types, functional units, and deployment bundle (no model download)"
depends = ["install", "browser:wasm"]
run = [
  "pnpm --filter @yagoo/browser-engine check",
  "pnpm --filter @yagoo/browser-engine test",
  "pnpm --filter @yagoo/browser-engine build",
]

[tasks.docs]
description = "Start the documentation site"
depends = ["install"]
run = "pnpm --filter @yagoo/docs dev"

[tasks."docs-build"]
description = "Build the documentation site"
depends = ["install"]
run = "pnpm --filter @yagoo/docs build"

[tasks.format]
description = "Format Rust sources"
depends = ["rust:format"]

[tasks."format-check"]
description = "Check Rust formatting without modifying files"
depends = ["rust:format:check"]

[tasks.lint]
description = "Run Rust Clippy"
depends = ["rust:clippy"]

[tasks.check]
description = "Format check, Clippy, cargo test, UI tests, and docs build"
depends = ["format-check", "lint", "rust:test", "ui:test", "browser:check", "docs-build"]

[tasks."python:sync"]
description = "Sync the uv-managed Python environment"
run = "uv sync --project python"

[tasks.ci]
description = "CI entrypoint (no performance or timing tests)"
depends = ["check"]

[tasks."katago:fetch-dev"]
description = "Download Eigen AVX2 KataGo + b18 net for local dev (not used in CI)"
run = "bash scripts/fetch-katago-dev.sh"

[tasks."fixtures:regen"]
description = "Regenerate sample KataGo fixtures + NDJSON with a local real engine (NOT for CI)"
run = "bash scripts/regen-fixtures.sh"

[tasks."yagoo:analyze"]
description = "Run yagoo analyze (requires YAGOO_KATAGO, YAGOO_MODEL, YAGOO_ANALYSIS_CONFIG)"
run = "cargo run -p yagoo-cli -- analyze"
