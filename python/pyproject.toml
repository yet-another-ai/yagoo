[project]
name = "yagoo-python"
version = "0.1.0"
description = "Python utilities for Yagoo (model conversion, activation extract, concept heads)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
  "torch>=2.6,<3",
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.23,<2",
  "onnxconverter-common>=1.14,<2",
  "packaging>=24",
]

[tool.uv]
package = false
