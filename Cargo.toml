[workspace]
members = [
    "crates/yagoo-core",
    "crates/yagoo-sgf",
    "crates/yagoo-katago",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/yet-another-ai/yagoo"

[workspace.dependencies]
yagoo-core = { path = "crates/yagoo-core" }
yagoo-sgf = { path = "crates/yagoo-sgf" }
yagoo-katago = { path = "crates/yagoo-katago" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Prefer concise API docs over `# Errors` on every fallible helper.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
